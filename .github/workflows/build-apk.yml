name: Build & Release Air Mouse APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract App Version & Compute Monotonic VersionCode
        id: version
        run: |
          RAW_VERSION=$(grep -oP 'val baseVersionName\s*=\s*"\K[^"]+' app/build.gradle.kts || grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "5.1")
          TAG="v${RAW_VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            VERSION_NAME="${RAW_VERSION}.${{ github.run_number }}"
            TAG="v${VERSION_NAME}"
          else
            VERSION_NAME="${RAW_VERSION}"
          fi
          VERSION_CODE=$((100 + ${{ github.run_number }}))
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Decode Signing Keystore from GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "${RUNNER_TEMP}/airmouse-release.keystore"
            echo "KEYSTORE_FILE=${RUNNER_TEMP}/airmouse-release.keystore" >> $GITHUB_ENV
          fi

      - name: Build Consistently Signed Air Mouse APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleDebug --no-daemon \
            -PappVersionName="${{ steps.version.outputs.version_name }}" \
            -PappVersionCode="${{ steps.version.outputs.version_code }}"
          cp app/build/outputs/apk/debug/*.apk "app/build/outputs/apk/debug/Air Mouse.apk"

      - name: Remove Temporary Keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/airmouse-release.keystore"

      - name: Upload Compiled Air Mouse APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Air-Mouse-APK
          path: "app/build/outputs/apk/debug/Air Mouse.apk"

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Air Mouse ${{ steps.version.outputs.tag }}"
          files: "app/build/outputs/apk/debug/Air Mouse.apk"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
